<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - Coquette</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Libre Baskerville', serif;
    background: linear-gradient(135deg, #ffe6f0, #ffd6eb, #ffc2e2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    overflow: hidden;
}

/* Floating hearts */
.hearts::before,
.hearts::after {
    content: "💗 💕 💞 💖";
    position: absolute;
    font-size: 20px;
    animation: floatHearts 15s linear infinite;
    opacity: 0.4;
}

.hearts::after {
    left: 60%;
    animation-duration: 20s;
}

@keyframes floatHearts {
    0% { transform: translateY(100vh); }
    100% { transform: translateY(-10vh); }
}

/* Card */
.mobile-container {
    width: 380px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    border-radius: 30px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(236, 64, 122, 0.3);
    border: 2px solid #f8bbd0;
    text-align: center;
    position: relative;
    z-index: 2;
}

/* Header */
.header {
    border-bottom: 2px solid #f8bbd0;
    padding-bottom: 12px;
    margin-bottom: 22px;
    position: relative;
}

.header h2 {
    color: #c2185b;
    font-weight: 700;
}

.header i {
    color: #c2185b;
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
}

/* Ribbon */
.ribbon {
    position: absolute;
    right: 0;
    top: -10px;
    font-size: 26px;
}

/* Profile */
.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 5px solid #f48fb1;
    object-fit: cover;
    box-shadow: 0 10px 30px rgba(236, 64, 122, 0.4);
}

/* Form */
.form-group {
    margin-bottom: 18px;
    text-align: left;
}

.form-group label {
    color: #880e4f;
    font-weight: 700;
    font-size: 13px;
}

.input-box {
    display: flex;
    align-items: center;
    background-color: #fff0f6;
    border: 2px solid #f8bbd0;
    border-radius: 25px;
    padding: 10px 15px;
    transition: 0.3s;
}

.input-box:hover {
    box-shadow: 0 8px 20px rgba(236, 64, 122, 0.3);
}

.input-box i {
    color: #ec407a;
    margin-right: 10px;
}

.input-box input {
    border: none;
    outline: none;
    width: 100%;
    background: transparent;
    font-family: 'Libre Baskerville', serif;
    color: #4a0033;
}

/* Button */
.btn-save {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: linear-gradient(135deg, #f48fb1, #ec407a);
    color: white;
    font-weight: 700;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: 0.3s;
}

.btn-save:hover {
    transform: scale(1.08);
    box-shadow: 0 15px 35px rgba(236, 64, 122, 0.4);
}

.back-home {
    position: fixed;
    top: 20px;
    left: 20px;
    text-decoration: none;
    background: linear-gradient(135deg, #f8bbd0, #f48fb1);
    color: white;
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 14px;
    box-shadow: 0 5px 15px rgba(236, 64, 122, 0.3);
    transition: 0.3s ease;
    }

    .back-home:hover {
    transform: translateY(-3px);
    }

    /* ================= RESPONSIVE HP ================= */
@media (max-width: 600px){

h1{
font-size: 1.6rem;
}

form{
padding: 20px;
border-radius: 18px;
}

fieldset{
padding: 15px;
}

input, select, textarea{
font-size: 14px;
}

button{
width: 100%;
margin-bottom: 10px;
}
}


</style>
</head>

<body>
<a href="index.html" class="back-home">🏠 Home</a>

<div class="mobile-container">

<div class="header">
    <i class="fa-solid fa-chevron-left"></i>
    <h2>Edit Profile</h2>
    <div class="ribbon">🎀</div>
</div>


    <div class="image-wrapper">
        <img src="https://i.pinimg.com/originals/06/91/21/069121b1f24c7d6285e60e78e4c8c0fb.jpg" class="profile-img">
        <div class="edit-icon-badge">
            <i class="fa-solid fa-camera"></i> Change Photo
        </div>
    </div>

    <form>
        <div class="form-group">
            <label>Full Name</label>
            <div class="input-box">
                <i class="fa-regular fa-user"></i>
                <input type="text" value="Syifaun Nadliroh">
            </div>
        </div>

        <div class="form-group">
            <label>Alamat</label>
            <div class="input-box">
                <i class="fa-solid fa-map-marker"></i>
                <input type="text" value="Dusun Manggung Sari, Wonokerto, Turi, Sleman, Yogyakarta">
            </div>
        </div>

        <div class="form-group">
            <label>Tanggal Lahir</label>
            <div class="input-box">
                <i class="fa-solid fa-calendar"></i>
                <input type="text" value="31 October 2008">
            </div>
        </div>

        <div class="form-group">
            <label>Hobi</label>
            <div class="input-box">
                <i class="fa-solid fa-heart"></i>
                <input type="text" value="Membaca, Mendengarkan Musik, Belajar Coding">
            </div>
        </div>

        <button type="button" class="btn-save">SAVE PROFILE</button>
    </form>
</div>

<div class="hearts"></div>

</body>
</html>
