<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coquette Button Collection 🎀</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffe6f0, #ffd6eb, #ffc2e2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* floating hearts */
body::before {
    content: "💗 💕 💖 💞 💓";
    position: fixed;
    font-size: 20px;
    opacity: 0.3;
    animation: float 20s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); }
    100% { transform: translateY(-10vh); }
}

.container {
    max-width: 800px;
    background: rgba(255,255,255,0.95);
    padding: 50px;
    border-radius: 30px;
    border: 2px solid #f8bbd0;
    box-shadow: 0 25px 60px rgba(236, 64, 122, 0.25);
    position: relative;
}

/* lace border */
.container::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px dashed #f8bbd0;
    border-radius: 25px;
    pointer-events: none;
}

h1 {
    font-family: 'Playfair Display', serif;
    text-align: center;
    color: #c2185b;
    margin-bottom: 40px;
    letter-spacing: 3px;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 25px;
}

/* base button */
.btn {
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
}

/* 🎀 SCALE */
.btn--scale {
    background: linear-gradient(135deg, #f8bbd0, #f48fb1);
    box-shadow: 0 8px 20px rgba(236, 64, 122, 0.3);
}

.btn--scale:hover {
    transform: translateY(-6px) scale(1.07);
    box-shadow: 0 15px 35px rgba(236, 64, 122, 0.4);
}

/* 💕 SHADOW GLOW */
.btn--shadow {
    background: linear-gradient(135deg, #ffc1e3, #ff80bf);
}

.btn--shadow:hover {
    box-shadow: 0 0 30px #ff80bf;
}

/* ✨ GRADIENT SHIFT */
.btn--gradient {
    background: linear-gradient(90deg, #ffd6eb, #ff80bf);
}

.btn--gradient:hover {
    background: linear-gradient(90deg, #ff80bf, #ff4081);
}

/* 🌸 LIFT BUTTON */
.btn--lift {
    background: linear-gradient(135deg, #fce4ec, #f8bbd0);
    box-shadow: 0 8px 20px rgba(236, 64, 122, 0.25);
}

.btn--lift:hover {
    transform: translateY(-8px);
    box-shadow: 0 18px 40px rgba(236, 64, 122, 0.35);
}

.btn--lift:active {
    transform: translateY(3px);
    box-shadow: 0 5px 15px rgba(236, 64, 122, 0.2);
}
.back-home {
    position: fixed;
    top: 20px;
    left: 20px;
    text-decoration: none;
    background: linear-gradient(135deg, #f8bbd0, #f48fb1);
    color: white;
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 14px;
    box-shadow: 0 5px 15px rgba(236, 64, 122, 0.3);
    transition: 0.3s ease;
    }

.back-home:hover {
    transform: translateY(-3px);
    }

    /* ================= RESPONSIVE HP ================= */
@media (max-width: 600px){

h1{
font-size: 1.6rem;
}

form{
padding: 20px;
border-radius: 18px;
}

fieldset{
padding: 15px;
}

input, select, textarea{
font-size: 14px;
}

button{
width: 100%;
margin-bottom: 10px;
}
}

    
</style>
</head>

<body>
    <a href="index.html" class="back-home">🏠 Home</a>

<div class="container">
    <h1>🎀 Coquette Button Set</h1>

    <div class="button-grid">
        <button class="btn btn--scale">Princess</button>
        <button class="btn btn--shadow">Sparkle</button>
        <button class="btn btn--gradient">Blush</button>
        <button class="btn btn--lift">Lift</button>
    </div>
</div>

</body>
</html>
